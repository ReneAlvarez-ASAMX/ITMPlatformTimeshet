name: Release Windows

# Publica el instalador de Windows como una GitHub Release cuando se sube una etiqueta "vX.Y.Z".
# La app instalada consulta esa release para detectar y ofrecer la actualización.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release-win:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify tag matches package.json version
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$VERSION" ]; then
            echo "La etiqueta ($GITHUB_REF_NAME) no coincide con la versión de package.json ($VERSION)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Package and publish Windows installer
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
